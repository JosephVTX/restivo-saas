services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      TENANCY_CACHE_STORE: redis
      OCTANE_SERVER: frankenphp
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restivo
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: restivo
      MYSQL_PASSWORD: secret
    command: --innodb-buffer-pool-size=128M --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
